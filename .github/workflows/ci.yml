name: Student Performance MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Project Imports
        run: |
          python -c "import src.data_preprocessing; import api.main; print('Imports verified successfully!')"

      - name: Run Pytest Unit Tests
        run: |
          pytest tests/ -v

      - name: Test Docker Image Build
        run: |
          docker build -t student-mlops-app:ci .
